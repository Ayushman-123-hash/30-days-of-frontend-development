<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="counter">
            <h1 class="count" >Counter Number</h1>
            <h2 class="count" id="Count">0</h2>
        </div>

        <div class="btn">
            <button class="btn-primary" id="inc">+</button>
            <button class="btn-primary" id="rst">Reset</button>
            <button class="btn-primary" id="dec">-</button>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
